[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anochan"
version = "0.1.0"
description = "An anomaly-detection package with malchan-style preprocessing and model pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "tanaka akihiro", email = "tanakakao3373@gmail.com" },
]
keywords = [
  "anomaly-detection",
  "outlier-detection",
  "machine-learning",
  "manufacturing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]
test = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pytest>=8.0",
]
dev = [
  "black>=24.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mypy>=1.8",
  "pydantic>=2.7",
  "pytest>=8.0",
  "ruff>=0.6",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
anochan-api = "anochan.api:main"

[project.urls]
Repository = "https://github.com/tanakakao/anochan"
Issues = "https://github.com/tanakakao/anochan/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anochan*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]
